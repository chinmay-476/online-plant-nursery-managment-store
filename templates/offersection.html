{% extends "base.html" %}

{% block content %}
<h1 class="page-title">Offer Section</h1>

<div class="offer-grid">
    {% for id, plant in plants.items() %}
        <article class="offer-card">
            <img src="{{ url_for('static', filename='images/' + plant.image) }}" alt="{{ plant.name }}">
            <div class="offer-content">
                <h3>{{ plant.name }}</h3>
                <p>{{ plant.description }}</p>
                <div class="price-row">
                    <strong>{{ plant.price }}</strong>
                    <span class="badge">Hot Deal</span>
                </div>
                <a href="{{ url_for('plant_detail', plant_id=id) }}" class="btn btn-primary">Grab Offer</a>
            </div>
        </article>
    {% else %}
        <p>No active offers right now.</p>
    {% endfor %}
</div>

<style>
    .offer-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 16px;
    }
    .offer-card {
        background: var(--surface-color);
        border: 1px solid var(--border-color);
        border-radius: 14px;
        overflow: hidden;
        box-shadow: var(--shadow);
    }
    .offer-card img {
        width: 100%;
        height: 180px;
        object-fit: cover;
    }
    .offer-content {
        padding: 14px;
    }
    .price-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 8px 0 12px;
    }
    .badge {
        background: #ff6b35;
        color: #fff;
        border-radius: 12px;
        padding: 4px 8px;
        font-size: 0.8rem;
    }
</style>
{% endblock %}
