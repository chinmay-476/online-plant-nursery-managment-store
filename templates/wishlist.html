{% extends "base.html" %}

{% block content %}
<div class="wishlist-page">
    <h1 class="page-title">Your Wishlist</h1>
    <div class="wishlist-meta">
        <span id="wishlistCountText">0 items</span>
        <span id="wishlistValueText">Total: &#8377;0</span>
    </div>

    <div class="wishlist-actions">
        <button class="btn btn-secondary" id="clearWishlistBtn" type="button">Clear Wishlist</button>
    </div>

    <div id="wishlistGrid" class="wishlist-grid"></div>
    <div id="emptyState" class="card empty-state" style="display: none;">
        <h3>Your wishlist is empty</h3>
        <p>Add plants from the catalog to see them here.</p>
        <a href="{{ url_for('showproduct') }}" class="btn btn-primary">Browse Plants</a>
    </div>
</div>

<style>
    .wishlist-page {
        max-width: 1100px;
        margin: 0 auto;
    }

    .wishlist-meta {
        display: flex;
        gap: 18px;
        justify-content: center;
        color: var(--text-muted);
        margin-bottom: 14px;
    }

    .wishlist-actions {
        display: flex;
        justify-content: center;
        margin-bottom: 20px;
    }

    .wishlist-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 16px;
    }

    .wishlist-item {
        background: var(--surface-color);
        border: 1px solid var(--border-color);
        border-radius: 14px;
        overflow: hidden;
        box-shadow: var(--shadow);
    }

    .wishlist-item img {
        width: 100%;
        height: 170px;
        object-fit: cover;
    }

    .wishlist-item-content {
        padding: 14px;
    }

    .wishlist-item h3 {
        margin-bottom: 6px;
        font-size: 1.05rem;
    }

    .wishlist-item p {
        margin: 4px 0;
        color: var(--text-muted);
        font-size: 0.92rem;
    }

    .wishlist-item-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-top: 10px;
    }

    .wishlist-item-actions .btn {
        width: 100%;
        padding: 10px;
        font-size: 0.9rem;
    }

    .remove-btn {
        background: #dc3545;
        color: #fff;
        border: 0;
    }

    .empty-state {
        text-align: center;
    }
</style>

<script>
    const plantsData = {{ plants | tojson }};
    const isLoggedIn = {{ 'true' if user_logged_in else 'false' }};
    const serverWishlistIds = {{ server_wishlist_ids | tojson }};
    const addToCartUrlTemplate = {{ url_for('add_to_cart', plant_id='__PID__') | tojson }};

    function parsePrice(priceStr) {
        if (typeof priceStr === "number") return priceStr;
        return parseInt(String(priceStr || "").replace(/[^\d]/g, ""), 10) || 0;
    }

    function getWishlist() {
        if (typeof getWishlistIds === "function") {
            return getWishlistIds();
        }
        return [];
    }

    function saveWishlist(items) {
        const normalized = Array.from(new Set((items || []).map((id) => String(id || "").trim()).filter(Boolean)));
        if (typeof setWishlistIds === "function") {
            setWishlistIds(normalized);
            return normalized;
        }
        return normalized;
    }

    function updateSummary(items) {
        const total = items.reduce((sum, plantId) => {
            const plant = plantsData[plantId];
            return plant ? sum + parsePrice(plant.price) : sum;
        }, 0);
        document.getElementById("wishlistCountText").textContent = `${items.length} item${items.length !== 1 ? "s" : ""}`;
        document.getElementById("wishlistValueText").textContent = `Total: \u20b9${total.toLocaleString()}`;
    }

    async function removeFromWishlist(plantId) {
        if (typeof removeWishlistItem === "function") {
            await removeWishlistItem(plantId, { silent: true });
        } else {
            const idToRemove = String(plantId || "").trim();
            const updated = getWishlist().filter((id) => id !== idToRemove);
            saveWishlist(updated);
        }
        if (typeof updateWishlistCount === "function") {
            updateWishlistCount();
        }
        renderWishlist();
    }

    function orderPlant(plantId) {
        if (!isLoggedIn) {
            window.location.href = "{{ url_for('login') }}";
            return;
        }
        window.location.href = `{{ url_for('deliveryinfo') }}?plant_id=${encodeURIComponent(plantId)}&quantity=1`;
    }

    function addToCart(plantId) {
        if (!isLoggedIn) {
            window.location.href = "{{ url_for('login') }}";
            return;
        }
        const next = encodeURIComponent(window.location.pathname);
        const addToCartUrl = addToCartUrlTemplate.replace("__PID__", encodeURIComponent(String(plantId)));
        window.location.href = `${addToCartUrl}?quantity=1&next=${next}`;
    }

    function renderWishlist() {
        const rawItems = getWishlist();
        const items = rawItems
            .map((id) => String(id || "").trim())
            .filter((id) => plantsData[id]);
        if (items.length !== rawItems.length) {
            saveWishlist(items);
            if (typeof updateWishlistCount === "function") {
                updateWishlistCount();
            }
        }

        const grid = document.getElementById("wishlistGrid");
        const emptyState = document.getElementById("emptyState");

        updateSummary(items);
        grid.innerHTML = "";

        if (!items.length) {
            grid.style.display = "none";
            emptyState.style.display = "block";
            return;
        }

        grid.style.display = "grid";
        emptyState.style.display = "none";

        items.forEach((plantId) => {
            const plant = plantsData[plantId];
            const card = document.createElement("article");
            card.className = "wishlist-item";
            card.innerHTML = `
                <img src="/static/images/${plant.image}" alt="${plant.name}">
                <div class="wishlist-item-content">
                    <h3>${plant.name}</h3>
                    <p>${plant.category}</p>
                    <p><strong>${plant.price}</strong></p>
                    <div class="wishlist-item-actions">
                        <a class="btn btn-secondary" href="/plant/${plantId}">View</a>
                        <button class="btn btn-primary" type="button" data-cart="${plantId}">Add to Cart</button>
                        <button class="btn btn-secondary" type="button" data-order="${plantId}">Buy Now</button>
                        <button class="btn remove-btn" type="button" data-remove="${plantId}">Remove</button>
                    </div>
                </div>
            `;
            grid.appendChild(card);
        });

        grid.querySelectorAll("[data-remove]").forEach((btn) => {
            btn.addEventListener("click", () => {
                removeFromWishlist(btn.dataset.remove);
            });
        });
        grid.querySelectorAll("[data-order]").forEach((btn) => {
            btn.addEventListener("click", () => orderPlant(btn.dataset.order));
        });
        grid.querySelectorAll("[data-cart]").forEach((btn) => {
            btn.addEventListener("click", () => addToCart(btn.dataset.cart));
        });
    }

    document.addEventListener("DOMContentLoaded", () => {
        if (isLoggedIn && Array.isArray(serverWishlistIds) && typeof setWishlistIds === "function") {
            setWishlistIds(serverWishlistIds);
        }

        document.getElementById("clearWishlistBtn").addEventListener("click", async () => {
            if (typeof clearWishlistItems === "function") {
                await clearWishlistItems({ silent: true });
            } else {
                saveWishlist([]);
            }
            if (typeof updateWishlistCount === "function") {
                updateWishlistCount();
            }
            renderWishlist();
        });
        renderWishlist();
    });
</script>
{% endblock %}
