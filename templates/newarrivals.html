{% extends "base.html" %}

{% block content %}
<h1 class="page-title">New Arrivals</h1>

<div class="product-grid">
    {% for id, plant in plants.items() %}
        <article class="product-card">
            <img src="{{ url_for('static', filename='images/' + plant.image) }}" alt="{{ plant.name }}">
            <div class="product-content">
                <h3>{{ plant.name }}</h3>
                <p>{{ plant.category }}</p>
                <p><strong>{{ plant.price }}</strong></p>
                <a href="{{ url_for('plant_detail', plant_id=id) }}" class="btn btn-primary">View Details</a>
            </div>
        </article>
    {% else %}
        <p>No new arrivals available right now.</p>
    {% endfor %}
</div>

<style>
    .product-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 16px;
    }
    .product-card {
        background: var(--surface-color);
        border: 1px solid var(--border-color);
        border-radius: 14px;
        overflow: hidden;
        box-shadow: var(--shadow);
    }
    .product-card img {
        width: 100%;
        height: 170px;
        object-fit: cover;
    }
    .product-content {
        padding: 14px;
    }
</style>
{% endblock %}
